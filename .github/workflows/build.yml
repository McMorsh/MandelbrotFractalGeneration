name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Windows / MSYS2 UCRT64
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-raylib
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-gtest

      - name: Configure
        run: cmake --preset mingw-release

      - name: Build
        run: cmake --build --preset mingw-release

      - name: Test
        run: ctest --preset mingw-release
